<!doctype html>
<meta charset="utf-8">
<title>Carte TryHackMe</title>
<!--
  Gabarit de la carte TryHackMe affichée dans le README du profil.

  Il n'affiche rien tout seul : assets/thm/shoot.mjs l'ouvre dans un Chromium
  headless, appelle window.render(data) avec la réponse de l'API publique
  https://tryhackme.com/api/v2/public-profile?username=<pseudo>, puis capture
  l'élément .card en PNG.

  Pour retoucher le design à la main, ouvre simplement ce fichier dans un
  navigateur : un jeu de données de démonstration s'affiche (voir tout en bas).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --bg-0:#070b14;
    --bg-1:#0e1626;
    --thm:#88cc14;                    /* vert TryHackMe */
    --thm-soft:rgba(136,204,20,.13);
    --thm-line:rgba(136,204,20,.26);
    --red:#c1272d;                    /* rouge TryHackMe */
    --txt:#eaf1ff;
    --mut:#798ab0;
    --mono:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,monospace;
    --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  }

  html,body{background:transparent}
  body{
    width:1040px;height:320px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative;
    width:1000px;height:280px;
    border-radius:22px;
    background:
      radial-gradient(700px 320px at 6% -30%, rgba(136,204,20,.17), transparent 60%),
      radial-gradient(560px 300px at 103% 132%, rgba(193,39,45,.15), transparent 62%),
      linear-gradient(158deg, var(--bg-1) 0%, var(--bg-0) 74%);
    border:1px solid var(--thm-line);
    box-shadow:0 0 0 1px rgba(255,255,255,.03) inset, 0 18px 50px rgba(0,0,0,.55);
    overflow:hidden;
    display:flex;align-items:center;gap:32px;
    padding:0 36px;
  }
  /* grille technique en fond */
  .card::before{
    content:'';position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(136,204,20,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(136,204,20,.055) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(600px 260px at 18% 40%,#000 10%,transparent 78%);
            mask-image:radial-gradient(600px 260px at 18% 40%,#000 10%,transparent 78%);
  }
  /* liseré vert -> rouge en haut */
  .card::after{
    content:'';position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--thm) 22%,var(--thm) 46%,var(--red) 78%,transparent);
    opacity:.85;
  }

  /* ---------------- colonne identité ---------------- */
  .left{position:relative;z-index:2;flex:1 1 auto;min-width:0}

  .brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .brand svg{width:20px;height:20px;fill:var(--thm);flex:none;
             filter:drop-shadow(0 0 7px rgba(136,204,20,.55))}
  .brand span{font-family:var(--mono);font-size:11px;font-weight:700;
              letter-spacing:.30em;color:var(--thm);text-transform:uppercase}

  .idrow{display:flex;align-items:center;gap:16px}

  .avatar{
    width:64px;height:64px;border-radius:50%;flex:none;
    background:#0d1420 center/cover no-repeat;
    border:2px solid var(--thm);
    box-shadow:0 0 0 4px rgba(136,204,20,.12), 0 0 18px rgba(136,204,20,.30);
  }

  .user{
    font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .sub{margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:nowrap}
  .sub b{font-weight:400;color:var(--thm)}

  /* barre de classement */
  .rankbar{margin-top:18px;width:330px}
  .rankbar .track{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .rankbar .fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--thm),#b6f24a);
    box-shadow:0 0 12px rgba(136,204,20,.55);
  }
  .rankbar .cap{
    display:flex;justify-content:space-between;margin-top:7px;
    font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.06em;
  }
  .rankbar .cap b{color:var(--thm);font-weight:400}

  .cta{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:16px;padding:7px 14px;
    border:1px solid var(--thm-line);border-radius:999px;background:var(--thm-soft);
    font-family:var(--mono);font-size:11.5px;color:var(--thm);
  }
  .cta .dot{width:6px;height:6px;border-radius:50%;background:var(--thm);
            box-shadow:0 0 9px 2px rgba(136,204,20,.75);flex:none}

  /* ---------------- tuiles de stats ---------------- */
  .stats{position:relative;z-index:2;flex:none;display:flex;gap:12px}

  .tile{
    width:112px;height:104px;border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid rgba(136,204,20,.17);
    box-shadow:0 6px 18px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.02) inset;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  }
  /* Icônes en SVG inline et non en emoji : le PNG est produit sur un runner
     Ubuntu, dont le jeu d'emoji ne ressemble pas à celui de Windows/macOS. */
  .tile .ico{height:18px;display:flex;align-items:center}
  .tile .ico svg{
    width:18px;height:18px;fill:none;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  }
  .tile .val{font-size:27px;font-weight:800;color:var(--txt);line-height:1;letter-spacing:-.02em}
  .tile .val small{font-size:12px;font-weight:600;color:var(--mut);margin-left:3px}
  .tile .lab{
    font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.19em;color:var(--mut);text-transform:uppercase;
  }
  /* la tuile des points est celle qu'on met en avant */
  .tile.hero{
    border-color:rgba(136,204,20,.42);
    background:linear-gradient(180deg,rgba(136,204,20,.16),rgba(136,204,20,.04));
  }
  .tile.hero .val{color:var(--thm)}
</style>

<script>
  // Couleur d'accent par ligue TryHackMe.
  var LEAGUES = {
    bronze:'#cd7f32', silver:'#c0c8d4', gold:'#ffc83d',
    platinum:'#7fe3d4', diamond:'#8ad4ff'
  };

  function fr(n){ return Number(n).toLocaleString('fr-FR'); }   // 1862 -> 1 862

  // Icônes des tuiles, tracées au trait (viewBox 24, stroke via currentColor).
  var svg = function (body) { return '<svg viewBox="0 0 24 24">' + body + '</svg>'; };
  var ICONS = {
    trophy: svg('<path d="M8 21h8M12 17v4M6 4h12v5a6 6 0 0 1-12 0V4z"/>'
              + '<path d="M6 5.5H4.4a2 2 0 0 0 0 4H6M18 5.5h1.6a2 2 0 0 1 0 4H18"/>'),
    door:   svg('<path d="M5.5 3h10a1 1 0 0 1 1 1v17h-11z"/><path d="M13.5 12h.01"/>'),
    medal:  svg('<circle cx="12" cy="15.5" r="5"/><path d="M9 10.8 6.5 3h11L15 10.8"/>'),
    flame:  svg('<path d="M12 3.2c3.2 2.6 5 5.4 5 8.3a5 5 0 0 1-10 0c0-1.9.9-3.4 2-4.4'
              + '.1 1.5 1 2.5 2 2.5 1.2 0 1.6-1.2 1.1-3-.4-1.4-.4-2.5-.1-3.4z"/>')
  };

  window.render = function (d, avatarDataUri) {
    document.getElementById('user').textContent = d.username;
    document.getElementById('cta').textContent  = 'tryhackme.com/p/' + d.username;

    if (avatarDataUri) {
      document.getElementById('avatar').style.backgroundImage = 'url("' + avatarDataUri + '")';
    }

    var tier = (d.leagueTier || '').toLowerCase();
    var sub  = document.getElementById('sub');
    sub.innerHTML = 'niveau <b>' + d.level + '</b>'
                  + ' &middot; ' + (d.rank || '—')
                  + (tier ? ' &middot; ligue <span class="league">' + tier + '</span>' : '');
    var lg = sub.querySelector('.league');
    if (lg && LEAGUES[tier]) lg.style.color = LEAGUES[tier];

    // "Top 40%" => le compte devance 60% des membres : c'est ce que remplit la barre.
    var top = typeof d.topPercentage === 'number' ? d.topPercentage : null;
    if (top !== null) {
      document.getElementById('fill').style.width = (100 - top) + '%';
      document.getElementById('capLeft').textContent  = 'classement mondial';
      document.getElementById('capRight').innerHTML   = '<b>top ' + top + '%</b>';
    } else {
      document.getElementById('rankbar').style.visibility = 'hidden';
    }

    var jour = d.streak === 1 ? 'jour' : 'jours';
    var tiles = [
      { ico:ICONS.trophy, tint:'#88cc14', lab:'points', val:fr(d.totalPoints), hero:true },
      { ico:ICONS.door,   tint:'#8ad4ff', lab:'rooms',  val:fr(d.completedRoomsNumber) },
      { ico:ICONS.medal,  tint:'#ffc83d', lab:'badges', val:fr(d.badgesNumber) },
      { ico:ICONS.flame,  tint:'#ff7a3d', lab:'streak', val:fr(d.streak) + '<small>' + jour + '</small>' }
    ];
    document.getElementById('stats').innerHTML = tiles.map(function (t) {
      return '<div class="tile' + (t.hero ? ' hero' : '') + '">'
           +   '<div class="ico" style="color:' + t.tint + '">' + t.ico + '</div>'
           +   '<div class="val">' + t.val + '</div>'
           +   '<div class="lab">' + t.lab + '</div>'
           + '</div>';
    }).join('');
  };

  // Ouverture directe dans un navigateur (hors Playwright) : jeu de données de
  // démonstration, pour pouvoir retoucher le design sans lancer le workflow.
  if (!navigator.webdriver) {
    window.render({
      username:'Antoineh', level:3, totalPoints:862, completedRoomsNumber:12,
      badgesNumber:2, streak:1, rank:'Top 40%', topPercentage:40, leagueTier:'bronze'
    });
  }
</script>
