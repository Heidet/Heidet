name: Diagnostic TryHackMe

# Workflow temporaire. Les runners ubuntu-latest sont filtres par TryHackMe
# (Attack Challenge Mode de Vercel, « Code 21 »). Les runners macOS et Windows
# de GitHub sont sur d'autres plages d'adresses : on sonde les trois pour voir
# si l'un passe.
#
# Le resultat est commite dans assets/thm/_diagnostic.md plutot que laisse dans
# les logs, qui ne sont lisibles qu'avec les droits admin du depot.
# A supprimer une fois la question tranchee.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/thm/probe.mjs'
      - '.github/workflows/thm-diagnostic.yml'

permissions:
  contents: write

jobs:
  sonde:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      THM_USERNAME: Antoineh

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sonder depuis ${{ matrix.os }}
        env:
          OUT_FILE: sonde-${{ matrix.os }}.md
        run: node assets/thm/probe.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: sonde-${{ matrix.os }}
          path: sonde-${{ matrix.os }}.md

  rapport:
    needs: sonde
    if: always()          # on veut le rapport meme si une sonde a plante
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: sondes
          merge-multiple: true

      - name: Assembler et committer
        run: |
          {
            echo "# Quel runner GitHub peut joindre TryHackMe ?"
            echo
            echo "| runner | IP publique | verdict | detail |"
            echo "|--------|-------------|---------|--------|"
            cat sondes/*.md 2>/dev/null | sort
          } > assets/thm/_diagnostic.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/thm/_diagnostic.md
          git diff --cached --quiet && { echo "Rapport inchange."; exit 0; }
          git commit -m "chore: sonde TryHackMe sur les trois runners"
          git push
