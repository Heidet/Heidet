name: Carte TryHackMe

# TryHackMe ne sert plus de PNG statique : l'URL qu'elle annonce elle-même
# (tryhackme-badges.s3.amazonaws.com/<pseudo>.png) répond 403, et son badge
# actuel est une iframe, que GitHub ne rend pas dans un README.
#
# Ce workflow lit donc l'API publique /api/v2/public-profile, dessine la carte
# avec assets/thm/card.html et en committe un PNG. Rien à faire à la main :
# le seul réglage est le pseudo ci-dessous.

# DÉCLENCHEMENT AUTOMATIQUE DÉSACTIVÉ — voir la note en bas de fichier.
# TryHackMe filtre les IP de datacenter : depuis un runner GitHub, l'API répond
# HTTP 429 (page de challenge Vercel) à chaque tentative. La carte est donc
# régénérée depuis une machine perso. Ce workflow reste là, lançable à la main,
# pour le jour où TryHackMe lèvera ce filtrage.
on:
  workflow_dispatch:            # bouton "Run workflow" uniquement

permissions:
  contents: write               # nécessaire pour committer le PNG régénéré

concurrency:
  group: carte-tryhackme
  cancel-in-progress: true

jobs:
  carte:
    runs-on: ubuntu-latest
    env:
      THM_USERNAME: Antoineh
      OUT_PATH: assets/tryhackme-card.png

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Playwright et Chromium
        run: |
          npm install --prefix assets/thm --no-audit --no-fund
          npx --prefix assets/thm playwright install --with-deps chromium

      - name: Générer la carte
        run: node assets/thm/shoot.mjs

      - name: Committer si les stats ont bougé
        run: |
          if git diff --quiet -- "$OUT_PATH"; then
            echo "Stats identiques au dernier run, rien à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT_PATH"
          git commit -m "chore: mise à jour de la carte TryHackMe"
          git push

# ----------------------------------------------------------------------------
# Pourquoi ce workflow ne tourne plus tout seul
#
# Constat du 20/08/2026 : depuis un runner GitHub, tryhackme.com renvoie
# systematiquement une page « Vercel Security Checkpoint » en HTTP 429 au lieu
# du JSON attendu -- 4 tentatives, refus immediat a chaque fois. Le meme script,
# lance depuis une IP residentielle, passe sans rien de special.
#
# Ce n'est pas une question d'empreinte de navigateur : le script utilise deja
# le nouveau headless, un User-Agent realiste, et passe par la page d'accueil
# pour laisser le challenge poser son cookie. Ce n'est pas non plus specifique
# a GitHub : les relais publics testes (r.jina.ai, allorigins, codetabs)
# recoivent le meme checkpoint. Le filtrage vise les IP de datacenter.
#
# Enfin, virtualISP/tryhackme-profile-badge, qui fait la meme chose, n'a plus
# commite de badge depuis le 01/06/2026 alors que son streak change chaque jour.
#
# La carte est donc regeneree depuis une machine perso :
#   npm install --prefix assets/thm
#   node assets/thm/shoot.mjs
#   git commit -am "chore: mise a jour de la carte TryHackMe" && git push
# ----------------------------------------------------------------------------
